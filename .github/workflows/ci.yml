# PureLang is PUBLIC — free Actions minutes on public repos.
name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 1

jobs:
  docs:
    name: Check Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check core docs
        run: |
          test -f README.md
          test -f docs/ARCHITECTURE.md
          test -f docs/MEMORY_MODEL.md
          test -f docs/SYNTAX.md
          test -f docs/COMPILER.md
          test -f docs/ROADMAP.md
          test -f docs/PLATFORMS.md
          test -f LICENSE
          for f in hello game_loop funcs structs lists list_loop methods enums ownership typed_params try_op modules generics traits visibility stdlib file_io list_helpers strings list_stats time_exit net_sleep channels strings_index fn_values thread_spawn bootstrap_lexer bootstrap_parser ui_native while_loop maps ui_demo; do
            test -f examples/$f.pure
          done

  mobile:
    name: Mobile sysroot scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Android/iOS build scripts
        run: |
          bash scripts/android_build.sh --check
          bash scripts/ios_build.sh --check
          test -f bootstrap/lexer.pure
          test -f bootstrap/token_scan.pure

  mobile-ndk:
    name: Mobile NDK (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true
      - name: Android script with NDK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          bash scripts/android_build.sh --check
          echo "NDK_HOME=$ANDROID_NDK_HOME"
          test -d "$ANDROID_NDK_HOME"

  mobile-ios:
    name: Mobile iOS (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: iOS sysroot check
        run: |
          bash scripts/ios_build.sh --check
          xcrun -sdk iphoneos --show-sdk-path

  package:
    name: Device packaging artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang libssl-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build purec
        working-directory: compiler
        run: cargo build --release
      - name: Android packaging skeleton
        run: |
          bash scripts/android_build.sh --check
          mkdir -p dist/android
          echo "PureLang Android packaging stub" > dist/android/README.txt
          echo "Use scripts/android_build.sh with ANDROID_NDK_HOME to produce libpureapp.so" >> dist/android/README.txt
          bash scripts/package_android_aab.sh
          bash scripts/package_ios_ipa.sh
          bash scripts/package_desktop.sh dist/desktop || true
      - name: Desktop package
        run: |
          mkdir -p dist/linux
          compiler/target/release/purec --compile -o dist/linux/hello examples/hello.pure
          cp compiler/target/release/purec dist/linux/
          tar -czf dist/purelang-linux-x64.tar.gz -C dist linux
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: purelang-packages
          path: dist/

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v7

      - name: Install latest stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install clang (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang libssl-dev

      - name: Install LLVM/clang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm -y --no-progress
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Ensure clang (macOS)
        if: runner.os == 'macOS'
        run: |
          which clang || xcode-select --install || true
          clang --version | head -1

      - name: Show toolchain
        shell: bash
        run: |
          rustc --version
          clang --version | head -1 || true
          echo "OS: ${{ runner.os }} / ${{ matrix.os }}"

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          shared-key: purec-${{ matrix.os }}-stable
          cache-on-failure: true
          cache-all-crates: true

      - name: fmt
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: clippy
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets -- -D warnings

      - name: Build purec
        run: cargo build --release

      - name: Type-check examples
        shell: bash
        run: |
          for f in hello game_loop funcs structs lists list_loop methods enums ownership typed_params try_op modules generics traits visibility stdlib file_io list_helpers strings list_stats time_exit net_sleep channels strings_index fn_values thread_spawn bootstrap_lexer bootstrap_parser ui_native while_loop maps ui_demo; do
            cargo run --release -- ../examples/$f.pure
          done

      - name: Compile & run examples (native)
        shell: bash
        run: |
          for f in hello game_loop funcs structs lists list_loop methods enums ownership typed_params try_op modules generics traits visibility stdlib file_io list_helpers strings list_stats time_exit net_sleep channels strings_index fn_values thread_spawn bootstrap_lexer bootstrap_parser ui_native while_loop maps ui_demo; do
            cargo run --release -- --compile -o ../tmp_$f ../examples/$f.pure
            echo "=== $f ==="
            ../tmp_$f || ../tmp_$f.exe || true
          done

      - name: Emit WebAssembly
        shell: bash
        run: |
          cargo run --release -- --emit-wasm -o /tmp/hello.wat ../examples/hello.pure || \
          cargo run --release -- --emit-wasm -o hello.wat ../examples/hello.pure
          test -s /tmp/hello.wat || test -s hello.wat
          echo "WASM ok"

      - name: Upload purec binary
        uses: actions/upload-artifact@v7
        with:
          name: purec-${{ matrix.os }}
          path: |
            compiler/target/release/purec
            compiler/target/release/purec.exe
          if-no-files-found: warn
          retention-days: 7
