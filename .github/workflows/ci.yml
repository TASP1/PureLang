# PureLang is PUBLIC — free Actions minutes on public repos.
name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 1

jobs:
  docs:
    name: Check Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check core docs
        run: |
          test -f README.md
          test -f docs/ARCHITECTURE.md
          test -f docs/MEMORY_MODEL.md
          test -f docs/SYNTAX.md
          test -f docs/COMPILER.md
          test -f docs/ROADMAP.md
          test -f docs/PLATFORMS.md
          test -f LICENSE
          for f in hello game_loop funcs structs lists list_loop methods enums ownership typed_params try_op modules generics traits visibility stdlib file_io list_helpers strings list_stats time_exit while_loop maps ui_demo; do
            test -f examples/$f.pure
          done

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v7

      - name: Install latest stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install clang (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang

      - name: Install LLVM/clang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm -y --no-progress
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Ensure clang (macOS)
        if: runner.os == 'macOS'
        run: |
          which clang || xcode-select --install || true
          clang --version | head -1

      - name: Show toolchain
        shell: bash
        run: |
          rustc --version
          clang --version | head -1 || true
          echo "OS: ${{ runner.os }} / ${{ matrix.os }}"

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          shared-key: purec-${{ matrix.os }}-stable
          cache-on-failure: true
          cache-all-crates: true

      - name: fmt
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: clippy
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets -- -D warnings

      - name: Build purec
        run: cargo build --release

      - name: Type-check examples
        shell: bash
        run: |
          for f in hello game_loop funcs structs lists list_loop methods enums ownership typed_params try_op modules generics traits visibility stdlib file_io list_helpers strings list_stats time_exit while_loop maps ui_demo; do
            cargo run --release -- ../examples/$f.pure
          done

      - name: Compile & run examples (native)
        shell: bash
        run: |
          for f in hello game_loop funcs structs lists list_loop methods enums ownership typed_params try_op modules generics traits visibility stdlib file_io list_helpers strings list_stats time_exit while_loop maps ui_demo; do
            cargo run --release -- --compile -o ../tmp_$f ../examples/$f.pure
            echo "=== $f ==="
            ../tmp_$f || ../tmp_$f.exe || true
          done

      - name: Emit WebAssembly
        shell: bash
        run: |
          cargo run --release -- --emit-wasm -o /tmp/hello.wat ../examples/hello.pure || \
          cargo run --release -- --emit-wasm -o hello.wat ../examples/hello.pure
          test -s /tmp/hello.wat || test -s hello.wat
          echo "WASM ok"

      - name: Upload purec binary
        uses: actions/upload-artifact@v7
        with:
          name: purec-${{ matrix.os }}
          path: |
            compiler/target/release/purec
            compiler/target/release/purec.exe
          if-no-files-found: warn
          retention-days: 7
