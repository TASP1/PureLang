name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

# Always use the newest GitHub-hosted environment
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  docs:
    name: Check Documentation
    runs-on: ubuntu-latest   # tracks newest Ubuntu (currently 24.04 → 26.04 soon)
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Markdown files exist
        run: |
          echo "Verifying core documentation..."
          test -f README.md
          test -f docs/ARCHITECTURE.md
          test -f docs/MEMORY_MODEL.md
          test -f docs/SYNTAX.md
          test -f docs/COMPILER.md
          test -f docs/ROADMAP.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          echo "All core documentation files are present."

      - name: List project structure
        run: |
          echo "Project structure:"
          find . -type f -not -path './.git/*' | sort

  build:
    name: Build Compiler (purec)
    runs-on: ubuntu-latest   # always latest stable GitHub runner image
    defaults:
      run:
        working-directory: compiler
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install latest stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # Explicitly request the absolute latest stable channel

      - name: Show toolchain versions
        run: |
          rustc --version --verbose
          cargo --version
          rustfmt --version
          clippy-driver --version
          echo "Runner OS: $RUNNER_OS"
          echo "Image OS: $(cat /etc/os-release | grep PRETTY_NAME)"

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          # Keep cache keys current with latest toolchain

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (lint)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build (release)
        run: cargo build --release

      - name: Run lexer on examples
        run: |
          echo "=== hello.pure ==="
          cargo run --release -- ../examples/hello.pure
          echo ""
          echo "=== game_loop.pure ==="
          cargo run --release -- ../examples/game_loop.pure

      - name: Upload purec binary
        uses: actions/upload-artifact@v7
        with:
          name: purec-${{ runner.os }}-${{ runner.arch }}
          path: compiler/target/release/purec
          if-no-files-found: error
          retention-days: 14
