# PureLang is PUBLIC — Actions minutes are free for public repos.
name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 1

jobs:
  docs:
    name: Check Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check core docs
        run: |
          test -f README.md
          test -f docs/ARCHITECTURE.md
          test -f docs/MEMORY_MODEL.md
          test -f docs/SYNTAX.md
          test -f docs/COMPILER.md
          test -f docs/ROADMAP.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          for f in hello game_loop funcs structs lists list_loop methods enums; do
            test -f examples/$f.pure
          done

  build:
    name: Build Compiler (purec)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v7

      - name: Install latest stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install clang
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang

      - name: Show versions
        run: |
          rustc --version
          clang --version | head -1
          echo "Repo: ${{ github.repository }} (public Actions — free minutes)"

      # Cache cargo registry, git deps, and target/ — speeds up every job after the first
      - name: Cache Rust (registry + target)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          shared-key: purec-ubuntu-stable
          cache-on-failure: true
          cache-all-crates: true

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release

      - name: Type-check examples
        run: |
          for f in hello game_loop funcs structs lists list_loop methods enums; do
            cargo run --release -- ../examples/$f.pure
          done

      - name: Compile & run examples (native)
        run: |
          for f in hello game_loop funcs structs lists list_loop methods enums; do
            cargo run --release -- --compile -o /tmp/$f ../examples/$f.pure
            echo "=== $f ==="
            /tmp/$f
          done

      - name: Emit WebAssembly
        run: |
          cargo run --release -- --emit-wasm -o /tmp/hello.wat ../examples/hello.pure
          test -s /tmp/hello.wat
          echo "WASM ok"

      - uses: actions/upload-artifact@v7
        with:
          name: purec-${{ runner.os }}-${{ runner.arch }}
          path: compiler/target/release/purec
          retention-days: 7
