name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  docs:
    name: Check Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Markdown files exist
        run: |
          test -f README.md
          test -f docs/ARCHITECTURE.md
          test -f docs/MEMORY_MODEL.md
          test -f docs/SYNTAX.md
          test -f docs/COMPILER.md
          test -f docs/ROADMAP.md
          test -f LICENSE
          test -f CONTRIBUTING.md

  build:
    name: Build Compiler (purec)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compiler
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install latest stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install clang (for native codegen)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang

      - name: Show toolchain versions
        run: |
          rustc --version --verbose
          cargo --version
          clang --version | head -1

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (lint)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build (release)
        run: cargo build --release

      - name: Type-check examples
        run: |
          cargo run --release -- ../examples/hello.pure
          cargo run --release -- ../examples/game_loop.pure

      - name: Compile examples to native
        run: |
          cargo run --release -- --compile -o /tmp/hello_pure ../examples/hello.pure
          cargo run --release -- --compile -o /tmp/game_loop ../examples/game_loop.pure
          echo "=== hello_pure ==="
          /tmp/hello_pure
          echo "=== game_loop ==="
          /tmp/game_loop

      - name: Emit WebAssembly
        run: |
          cargo run --release -- --emit-wasm -o /tmp/hello.wat ../examples/hello.pure
          cargo run --release -- --emit-wasm -o /tmp/game_loop.wat ../examples/game_loop.pure
          echo "WASM modules generated"
          wc -l /tmp/hello.wat /tmp/game_loop.wat

      - name: Upload purec binary
        uses: actions/upload-artifact@v7
        with:
          name: purec-${{ runner.os }}-${{ runner.arch }}
          path: compiler/target/release/purec
          if-no-files-found: error
          retention-days: 14
