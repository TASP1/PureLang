name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  docs:
    name: Check Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Markdown files exist
        run: |
          echo "Verifying core documentation..."
          test -f README.md
          test -f docs/ARCHITECTURE.md
          test -f docs/MEMORY_MODEL.md
          test -f docs/SYNTAX.md
          test -f docs/COMPILER.md
          test -f docs/ROADMAP.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          echo "All core documentation files are present."

      - name: List project structure
        run: |
          echo "Project structure:"
          find . -type f -not -path './.git/*' | sort

  build:
    name: Build Compiler (purec)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (lint)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build (release)
        run: cargo build --release

      - name: Run lexer on examples
        run: |
          echo "=== hello.pure ==="
          cargo run --release -- ../examples/hello.pure
          echo ""
          echo "=== game_loop.pure ==="
          cargo run --release -- ../examples/game_loop.pure

      - name: Upload purec binary
        uses: actions/upload-artifact@v4
        with:
          name: purec-${{ runner.os }}
          path: compiler/target/release/purec
          if-no-files-found: error
